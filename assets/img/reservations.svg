<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="A table set for two with candle, wine glasses and cutlery">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F8F2E7"/>
      <stop offset="1" stop-color="#E3D4BA"/>
    </linearGradient>
    <radialGradient id="rvig" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7A5C36" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="rflame" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F7D290" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F7D290" stop-opacity="0"/>
    </radialGradient>
    <filter id="rgrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#rbg)"/>
  <g stroke="#C9B894" stroke-width="1" opacity="0.35">
    <path d="M0 120H1000M0 250H1000M0 380H1000M0 510H1000M0 640H1000M0 770H1000M0 900H1000"/>
    <path d="M120 0V1000M250 0V1000M380 0V1000M510 0V1000M640 0V1000M770 0V1000M900 0V1000"/>
  </g>
  <rect width="1000" height="1000" fill="url(#rvig)"/>

  <!-- candle -->
  <circle cx="280" cy="215" r="130" fill="url(#rflame)"/>
  <rect x="262" y="228" width="36" height="112" rx="7" fill="#EFE4CF" stroke="#D3C1A2" stroke-width="1.6"/>
  <ellipse cx="280" cy="340" rx="42" ry="13" fill="#6E1B2A" opacity="0.35"/>
  <ellipse cx="280" cy="214" rx="10" ry="19" fill="#E7B87A"/>
  <ellipse cx="280" cy="216" rx="5" ry="11" fill="#F8E3B4"/>

  <!-- wine glass -->
  <circle cx="720" cy="228" r="62" fill="#FFFFFF" opacity="0.35"/>
  <circle cx="720" cy="228" r="60" fill="none" stroke="#6E1B2A" stroke-width="2.4"/>
  <path d="M660 228a60 60 0 0 0 120 0z" fill="#7A2033" opacity="0.75"/>
  <path d="M676 200a52 52 0 0 1 24 -18" fill="none" stroke="#FBF7F0" stroke-width="4" opacity="0.7" stroke-linecap="round"/>
  <rect x="716" y="286" width="8" height="78" fill="#6E1B2A"/>
  <ellipse cx="720" cy="372" rx="50" ry="13" fill="#6E1B2A"/>

  <!-- fork -->
  <g fill="#6E1B2A">
    <rect x="270" y="452" width="9" height="42"/>
    <rect x="266" y="486" width="17" height="230" rx="8"/>
    <rect x="262" y="404" width="25" height="52" rx="6"/>
    <rect x="265" y="378" width="4" height="34"/>
    <rect x="272" y="374" width="4" height="38"/>
    <rect x="279" y="378" width="4" height="34"/>
  </g>

  <!-- knife -->
  <g fill="#6E1B2A">
    <path d="M712 386h16l-2 150h-12z"/>
    <rect x="710" y="542" width="18" height="176" rx="9"/>
  </g>

  <!-- plate -->
  <circle cx="500" cy="540" r="204" fill="#FBF8F1" stroke="#CBB693" stroke-width="2"/>
  <circle cx="500" cy="540" r="172" fill="none" stroke="#E1D2B8" stroke-width="1.6"/>
  <circle cx="500" cy="540" r="150" fill="none" stroke="#E1D2B8" stroke-width="1" opacity="0.7"/>
  <g stroke="#7E8A5E" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M500 610v-70"/>
    <path d="M500 560q-22-12-30-2M500 578q22-12 30-2M500 596q-20-10-27-1"/>
  </g>

  <!-- salt & pepper -->
  <circle cx="188" cy="652" r="24" fill="#EFE4CF" stroke="#6E1B2A" stroke-width="2"/>
  <circle cx="188" cy="640" r="6" fill="#6E1B2A" opacity="0.5"/>
  <circle cx="236" cy="684" r="24" fill="#EFE4CF" stroke="#6E1B2A" stroke-width="2"/>
  <circle cx="236" cy="672" r="6" fill="#6E1B2A" opacity="0.5"/>

  <!-- napkin with sprig -->
  <g transform="rotate(-8 235 470)">
    <rect x="150" y="410" width="176" height="128" rx="6" fill="#F1E6D2" stroke="#D8C7A8" stroke-width="1.6"/>
    <path d="M150 448h176" stroke="#E0D0B6" stroke-width="1.4"/>
    <g stroke="#7E8A5E" stroke-width="2.6" fill="none" stroke-linecap="round">
      <path d="M238 470v34"/>
      <path d="M238 486q-14-8-20-1M238 500q14-8 20-1"/>
    </g>
  </g>

  <rect width="1000" height="1000" filter="url(#rgrain)" opacity="0.045"/>
</svg>
