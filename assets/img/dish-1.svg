<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" role="img" aria-label="A fried chicken sandwich with pickles and herb aioli">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#F8F2E7"/>
      <stop offset="1" stop-color="#E1D1B6"/>
    </linearGradient>
    <radialGradient id="svig" cx="50%" cy="40%" r="74%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7A5C36" stop-opacity="0.24"/>
    </radialGradient>
    <radialGradient id="sshadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6E1B2A" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#6E1B2A" stop-opacity="0"/>
    </radialGradient>
    <filter id="sgrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="900" height="1125" fill="url(#sbg)"/>
  <ellipse cx="450" cy="820" rx="400" ry="180" fill="url(#sshadow)"/>
  <rect width="900" height="1125" fill="url(#svig)"/>

  <!-- plate -->
  <ellipse cx="450" cy="800" rx="345" ry="150" fill="#FBF8F1" stroke="#CBB693" stroke-width="2.5"/>
  <ellipse cx="450" cy="800" rx="290" ry="118" fill="none" stroke="#E1D2B8" stroke-width="1.6"/>

  <!-- bottom bun -->
  <path d="M262 700h376a34 34 0 0 1-34 34H296a34 34 0 0 1-34-34z" fill="#C08F3E"/>
  <path d="M262 700h376v-14H262z" fill="#D8A854"/>

  <!-- aioli -->
  <path d="M276 686q40 20 174 20t174-20v-10H276z" fill="#F2E4C4"/>

  <!-- fried chicken -->
  <path d="M268 640c-14-30 6-56 40-58-10-32 24-54 56-42 14-30 58-30 72 0 32-12 66 10 56 42 34 2 54 28 40 58 18 26 2 58-30 60H298c-32-2-48-34-30-60z" fill="#B57324"/>
  <path d="M300 610c-6-20 10-36 34-38-6-20 18-34 40-26 10-18 40-18 50 0 22-8 46 6 40 26 24 2 40 18 34 38" fill="none" stroke="#8C5216" stroke-width="4" opacity="0.6"/>
  <g fill="#CE8C36">
    <circle cx="352" cy="606" r="12"/><circle cx="420" cy="590" r="14"/>
    <circle cx="492" cy="600" r="13"/><circle cx="548" cy="620" r="11"/>
    <circle cx="388" cy="638" r="10"/><circle cx="470" cy="640" r="12"/>
  </g>

  <!-- pickles -->
  <g fill="#7E8A5E">
    <ellipse cx="352" cy="676" rx="30" ry="12" transform="rotate(-6 352 676)"/>
    <ellipse cx="452" cy="682" rx="30" ry="12" transform="rotate(4 452 682)"/>
    <ellipse cx="546" cy="674" rx="28" ry="11" transform="rotate(-8 546 674)"/>
  </g>

  <!-- top bun -->
  <path d="M258 604c0-86 86-156 192-156s192 70 192 156z" fill="#CF9C4B"/>
  <path d="M258 604c0-60 42-108 104-130-52 30-70 82-66 130z" fill="#DDAC5C" opacity="0.7"/>
  <g fill="#F3E3BE" opacity="0.9">
    <ellipse cx="340" cy="520" rx="9" ry="5" transform="rotate(-18 340 520)"/>
    <ellipse cx="420" cy="490" rx="9" ry="5" transform="rotate(6 420 490)"/>
    <ellipse cx="500" cy="500" rx="9" ry="5" transform="rotate(22 500 500)"/>
    <ellipse cx="380" cy="556" rx="9" ry="5" transform="rotate(-6 380 556)"/>
    <ellipse cx="470" cy="552" rx="9" ry="5" transform="rotate(14 470 552)"/>
    <ellipse cx="545" cy="546" rx="9" ry="5" transform="rotate(-20 545 546)"/>
    <ellipse cx="300" cy="562" rx="9" ry="5" transform="rotate(8 300 562)"/>
  </g>

  <!-- herb sprig on plate -->
  <g stroke="#7E8A5E" stroke-width="3.4" fill="none" stroke-linecap="round">
    <path d="M646 862q30-10 42-34"/>
    <path d="M660 846q-4-20 8-32M676 830q-2-18 8-28"/>
  </g>

  <!-- ketchup dish -->
  <circle cx="726" cy="700" r="46" fill="#FBF8F1" stroke="#CBB693" stroke-width="2"/>
  <circle cx="726" cy="700" r="30" fill="#7A2033"/>

  <rect width="900" height="1125" filter="url(#sgrain)" opacity="0.05"/>
</svg>
