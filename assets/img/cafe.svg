<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Morning light across the counter of the Nestiique café">
  <defs>
    <linearGradient id="cbg3" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#F8F2E7"/>
      <stop offset="1" stop-color="#E0D0B6"/>
    </linearGradient>
    <linearGradient id="cwin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6DFB4"/>
      <stop offset="1" stop-color="#EFD3A0"/>
    </linearGradient>
    <radialGradient id="cvig3" cx="50%" cy="40%" r="76%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7A5C36" stop-opacity="0.26"/>
    </radialGradient>
    <filter id="cgrain3">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#cbg3)"/>

  <!-- back wall panelling -->
  <g stroke="#CDB894" stroke-width="1.2" opacity="0.5">
    <path d="M0 150H1200M0 470H1200"/>
    <path d="M100 0V620M300 0V620M500 0V620M700 0V620M900 0V620M1100 0V620"/>
  </g>

  <!-- arched window with light -->
  <path d="M740 620V300a120 120 0 0 1 240 0v320z" fill="url(#cwin)" stroke="#B79E76" stroke-width="2"/>
  <g stroke="#B79E76" stroke-width="1.4" opacity="0.5">
    <path d="M860 186v434M740 400h240"/>
  </g>
  <g opacity="0.22" fill="#F6DFB4">
    <path d="M760 620 L960 620 L1080 900 L640 900z"/>
  </g>

  <!-- hanging cups under shelf -->
  <g>
    <line x1="120" y1="250" x2="620" y2="250" stroke="#8A6B45" stroke-width="6" stroke-linecap="round"/>
    <g fill="#EFE4CF" stroke="#B79E76" stroke-width="1.6">
      <path d="M170 250h34l-4 26h-26z"/><path d="M220 250h34l-4 26h-26z"/>
      <path d="M270 250h34l-4 26h-26z"/><path d="M320 250h34l-4 26h-26z"/>
      <path d="M370 250h34l-4 26h-26z"/><path d="M420 250h34l-4 26h-26z"/>
    </g>
  </g>

  <!-- shelf with jars -->
  <g>
    <rect x="120" y="330" width="480" height="10" rx="4" fill="#CDB894"/>
    <g fill="#E9DECB" stroke="#B79E76" stroke-width="1.6">
      <rect x="150" y="282" width="44" height="48" rx="6"/>
      <rect x="212" y="268" width="40" height="62" rx="6"/>
      <rect x="270" y="290" width="52" height="40" rx="6"/>
      <rect x="342" y="276" width="38" height="54" rx="6"/>
      <rect x="398" y="292" width="46" height="38" rx="6"/>
    </g>
    <g fill="#7E8A5E" opacity="0.7">
      <rect x="156" y="306" width="32" height="24" rx="4"/>
      <rect x="218" y="300" width="28" height="30" rx="4"/>
      <rect x="276" y="308" width="40" height="22" rx="4"/>
      <rect x="348" y="304" width="26" height="26" rx="4"/>
      <rect x="404" y="310" width="34" height="20" rx="4"/>
    </g>
  </g>

  <!-- pendant lamps -->
  <g>
    <line x1="1010" y1="0" x2="1010" y2="150" stroke="#8A6B45" stroke-width="2"/>
    <path d="M966 200h88l-18-50h-52z" fill="#6E1B2A"/>
    <line x1="1120" y1="0" x2="1120" y2="110" stroke="#8A6B45" stroke-width="2"/>
    <path d="M1080 160h80l-16-50h-48z" fill="#6E1B2A"/>
  </g>

  <!-- counter -->
  <rect x="0" y="560" width="1200" height="60" fill="#7A5C36"/>
  <rect x="0" y="560" width="1200" height="16" fill="#9C7A48"/>
  <rect x="0" y="620" width="1200" height="280" fill="#6E4A2A"/>
  <g stroke="#5A3A20" stroke-width="3" opacity="0.7">
    <path d="M100 620v280M260 620v280M420 620v280M580 620v280M740 620v280M900 620v280M1060 620v280"/>
  </g>

  <!-- espresso machine -->
  <g>
    <rect x="620" y="470" width="230" height="90" rx="8" fill="#B79E76"/>
    <rect x="620" y="470" width="230" height="22" rx="8" fill="#CDB894"/>
    <rect x="636" y="492" width="60" height="52" rx="6" fill="#6E1B2A"/>
    <rect x="706" y="492" width="60" height="52" rx="6" fill="#85404F"/>
    <rect x="800" y="500" width="26" height="60" rx="4" fill="#E9DECB"/>
    <circle cx="740" cy="466" r="7" fill="#370B14"/>
    <path d="M850 470v-46a10 10 0 0 1 20 0v46" fill="none" stroke="#B79E76" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- cups + pastry on counter -->
  <g>
    <g fill="#FBF7F0" stroke="#B79E76" stroke-width="1.6">
      <rect x="250" y="512" width="52" height="48" rx="6"/>
      <rect x="330" y="520" width="46" height="40" rx="6"/>
    </g>
    <g fill="#6B4A32">
      <rect x="256" y="516" width="40" height="8" rx="4"/>
      <rect x="335" y="524" width="36" height="8" rx="4"/>
    </g>
    <ellipse cx="470" cy="548" rx="46" ry="20" fill="#FBF7F0" stroke="#B79E76" stroke-width="1.6"/>
    <path d="M440 542q30-18 60 0" fill="none" stroke="#C8973F" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- stools -->
  <g>
    <g fill="#8A5D22">
      <rect x="150" y="680" width="120" height="34" rx="16"/>
      <rect x="196" y="706" width="12" height="150"/>
      <rect x="216" y="706" width="12" height="150"/>
      <rect x="470" y="690" width="120" height="34" rx="16"/>
      <rect x="516" y="716" width="12" height="140"/>
      <rect x="536" y="716" width="12" height="140"/>
    </g>
    <ellipse cx="210" cy="680" rx="62" ry="16" fill="#A9762F"/>
    <ellipse cx="530" cy="690" rx="62" ry="16" fill="#A9762F"/>
  </g>

  <!-- plant -->
  <g transform="translate(30 300)">
    <path d="M60 260h60l-8 60H68z" fill="#A9762F"/>
    <g stroke="#7E8A5E" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M90 260q-40-70-18-130M90 260q6-80 54-120M90 260q-30-50-64-60"/>
    </g>
    <g fill="#7E8A5E" opacity="0.85">
      <ellipse cx="66" cy="120" rx="26" ry="14" transform="rotate(-40 66 120)"/>
      <ellipse cx="152" cy="132" rx="26" ry="14" transform="rotate(38 152 132)"/>
      <ellipse cx="34" cy="196" rx="24" ry="13" transform="rotate(-24 34 196)"/>
    </g>
  </g>

  <rect width="1200" height="900" fill="url(#cvig3)"/>
  <rect width="1200" height="900" filter="url(#cgrain3)" opacity="0.045"/>
</svg>
