<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" role="img" aria-label="A half rotisserie chicken with pan jus and herbs">
  <defs>
    <linearGradient id="kbg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#4A1420"/>
      <stop offset="1" stop-color="#260A11"/>
    </linearGradient>
    <radialGradient id="kglow" cx="50%" cy="34%" r="62%">
      <stop offset="0" stop-color="#C9762A" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#C9762A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="kvig" cx="50%" cy="45%" r="72%">
      <stop offset="0" stop-color="#9C3446" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#12040A" stop-opacity="0.75"/>
    </radialGradient>
    <filter id="kgrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="900" height="1125" fill="url(#kbg)"/>
  <circle cx="450" cy="470" r="420" fill="url(#kglow)"/>

  <!-- steam -->
  <g stroke="#E9DECB" stroke-width="5" fill="none" opacity="0.28" stroke-linecap="round">
    <path d="M360 250c-26-38 26-58 0-96"/>
    <path d="M452 220c-26-40 26-62 0-104"/>
    <path d="M544 250c-26-38 26-58 0-96"/>
  </g>

  <!-- platter -->
  <ellipse cx="450" cy="760" rx="380" ry="185" fill="#150710"/>
  <ellipse cx="450" cy="748" rx="380" ry="185" fill="#2A0F19"/>
  <ellipse cx="450" cy="748" rx="340" ry="162" fill="none" stroke="#B79E76" stroke-width="2" opacity="0.5"/>

  <!-- jus -->
  <ellipse cx="450" cy="742" rx="250" ry="110" fill="#5A1421"/>
  <ellipse cx="450" cy="738" rx="210" ry="88" fill="#7A2033" opacity="0.8"/>

  <!-- chicken body -->
  <ellipse cx="450" cy="620" rx="185" ry="140" fill="#B4712C"/>
  <ellipse cx="450" cy="606" rx="170" ry="124" fill="#C98A45"/>
  <path d="M330 560c50-46 190-46 240 0-40 34-200 34-240 0z" fill="#DDA35A" opacity="0.7"/>
  <g fill="#9C5A1E" opacity="0.55">
    <ellipse cx="380" cy="580" rx="10" ry="6"/><ellipse cx="450" cy="562" rx="11" ry="6"/>
    <ellipse cx="520" cy="582" rx="10" ry="6"/><ellipse cx="420" cy="648" rx="12" ry="7"/>
    <ellipse cx="500" cy="650" rx="12" ry="7"/>
  </g>

  <!-- drumstick 1 -->
  <g transform="rotate(-28 640 560)">
    <ellipse cx="672" cy="556" rx="76" ry="44" fill="#C98A45"/>
    <rect x="716" y="540" width="70" height="26" rx="13" fill="#E2C79A"/>
    <circle cx="786" cy="553" r="15" fill="#EFE0C4"/>
  </g>
  <!-- drumstick 2 -->
  <g transform="rotate(30 268 566)">
    <ellipse cx="232" cy="562" rx="72" ry="42" fill="#C1833D"/>
    <rect x="152" y="548" width="66" height="26" rx="13" fill="#E2C79A"/>
    <circle cx="146" cy="561" r="14" fill="#EFE0C4"/>
  </g>

  <!-- wing -->
  <path d="M470 700c60-6 96 20 92 54-38 8-80-12-92-54z" fill="#B4712C"/>

  <!-- herbs -->
  <g stroke="#7E8A5E" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M370 726q-30-26-58-30"/>
    <path d="M346 700q-6-20 4-32M326 712q-16-12-24-4"/>
    <path d="M540 730q30-24 58-26"/>
    <path d="M566 706q6-20-4-32M586 718q16-12 24-4"/>
  </g>

  <!-- peppercorns / salt -->
  <g fill="#E9DECB" opacity="0.8">
    <circle cx="330" cy="790" r="4"/><circle cx="356" cy="806" r="3"/>
    <circle cx="582" cy="794" r="4"/><circle cx="556" cy="810" r="3"/>
  </g>

  <rect width="900" height="1125" fill="url(#kvig)"/>
  <rect width="900" height="1125" filter="url(#kgrain)" opacity="0.06"/>
</svg>
