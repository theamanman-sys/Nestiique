<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" role="img" aria-label="A flat white coffee with latte art">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#F8F2E7"/>
      <stop offset="1" stop-color="#E2D2B7"/>
    </linearGradient>
    <radialGradient id="cvig" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7A5C36" stop-opacity="0.22"/>
    </radialGradient>
    <radialGradient id="cupShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6E1B2A" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6E1B2A" stop-opacity="0"/>
    </radialGradient>
    <filter id="cgrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="900" height="1125" fill="url(#cbg)"/>
  <ellipse cx="450" cy="640" rx="360" ry="330" fill="url(#cupShadow)"/>
  <rect width="900" height="1125" fill="url(#cvig)"/>

  <!-- saucer -->
  <circle cx="450" cy="585" r="330" fill="#FBF8F1" stroke="#CBB693" stroke-width="2.5"/>
  <circle cx="450" cy="585" r="286" fill="none" stroke="#E1D2B8" stroke-width="1.6"/>

  <!-- handle -->
  <path d="M690 480c66 0 96 52 96 105s-30 105-96 105" fill="none" stroke="#F3EADB" stroke-width="34" stroke-linecap="round"/>
  <path d="M690 480c66 0 96 52 96 105s-30 105-96 105" fill="none" stroke="#CDB894" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- cup -->
  <circle cx="450" cy="585" r="238" fill="#F7F0E3" stroke="#CDB894" stroke-width="2.5"/>
  <circle cx="450" cy="585" r="206" fill="#6B4A32"/>
  <circle cx="450" cy="585" r="206" fill="none" stroke="#4A3121" stroke-width="3" opacity="0.5"/>

  <!-- crema swirl + latte heart -->
  <g fill="#D8B98C" opacity="0.5">
    <circle cx="450" cy="585" r="196"/>
  </g>
  <path d="M450 690c-72-62-84-124-40-148 26-14 40 4 40 20 0-16 14-34 40-20 44 24 32 86-40 148z" fill="#F4ECDD"/>
  <path d="M450 668c-46-42-52-84-24-100" fill="none" stroke="#E3D4BA" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- spoon -->
  <g transform="rotate(18 720 880)">
    <ellipse cx="720" cy="880" rx="34" ry="46" fill="#CDB894" opacity="0.85"/>
    <rect x="712" y="918" width="16" height="150" rx="8" fill="#CDB894" opacity="0.85"/>
  </g>

  <!-- coffee beans -->
  <g fill="#5A3A28">
    <ellipse cx="196" cy="252" rx="22" ry="15" transform="rotate(-24 196 252)"/>
    <ellipse cx="248" cy="308" rx="20" ry="14" transform="rotate(12 248 308)"/>
    <ellipse cx="178" cy="330" rx="18" ry="12" transform="rotate(40 178 330)"/>
  </g>
  <g stroke="#3A2418" stroke-width="2" opacity="0.7">
    <path d="M182 244q14 8 28 16M234 300q12 6 20 16M166 322q14 6 22 16"/>
  </g>

  <rect width="900" height="1125" filter="url(#cgrain)" opacity="0.05"/>
</svg>
